name: Sync Tor Node List

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch Tor node list
        run: python fetch_tor_nodes.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add torlist-db/latest.all.csv \
                  torlist-db/latest.guards.csv \
                  torlist-db/latest.exits.csv

          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: sync tor node list — ${TIMESTAMP} [skip ci]"
            git push
          fi
